      description: CLI05. 대상자의 현재 열람 권한을 검사하고 방문·전화·혜택 지원·기관 연계 요청·연계 상태 변경을 함께 조회합니다. 연락은 contact_records.occurred_at,
        혜택은 benefit_actions.occurred_at, 연계 요청은 referrals.requested_at, 연계 변경은 referral_events.occurred_at을 사용합니다.
        최초 연계 생성 이벤트(from_status가 null)는 요청과 중복되므로 제외합니다. occurred_at 내림차순, event_type 오름차순, event_id 오름차순으로 정렬합니다.
        event_id는 해당 종류의 원본 행 ID이며 종류와 ID의 조합으로 이벤트를 식별합니다. 날짜 필터는 한국 날짜 양끝을 포함하며 시작일 00시 이상, 종료일 다음 날 00시 미만으로
        적용합니다. 시작일이 종료일보다 늦으면 422입니다. 각 이벤트의 detail에 관련 기록 상세를 포함합니다. 연락의 next_check_date는 성공·실패·거부 모두 필수입니다. 혜택
        before_state/after_state는 당시 값이며 연계 from_status/to_status/change_result는 당시 변경입니다. 연계 current_status/current_result와
        처리시각은 조회 시각의 현재 요청 상태입니다. 연계는 내부 가상 처리로 delivery_status는 NOT_SENT입니다. 페이지·권한·조회 기준시각·공통 응답 규칙은 목록과 같습니다.
