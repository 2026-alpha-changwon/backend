                      source_label: 가상 초기 상담 기록
                      source_url: null
                      checked_at: '2026-11-03T09:00:00+09:00'
                    household_type:
                      status: AVAILABLE
                      reason: null
                      source_label: 가상 초기 상담 기록
                      source_url: null
                      checked_at: '2026-11-03T09:00:00+09:00'
                    risk.score:
                      status: UNAVAILABLE
                      reason: 위험점수 계산 결과가 없습니다.
                      source_label: null
                      source_url: null
                      checked_at: null
                    risk.grade:
                      status: UNAVAILABLE
                      reason: 위험점수 계산 결과가 없습니다.
                      source_label: null
                      source_url: null
                      checked_at: null
                    last_success_at:
                      status: AVAILABLE
                      reason: null
                      source_label: 가상 초기 상담 기록
                      source_url: null
