openapi: 3.1.0
info:
  title: 먼저가요 창원 API
  version: 0.2.0
  description: R03 대상자 목록·상세·통합 이력을 구현했습니다. 공통 JSON 응답은 data와 error를 포함합니다. 성공 시 error는 null이고 실패 시 data는 null입니다.
    204는 본문 없이 반환합니다. 개인 자료는 가상이며 R03의 data_mode는 DEMO입니다. 현재 사용자 확인은 세션 쿠키의 해시·만료·폐기·계정 활성 상태를 검사합니다.
    인증 API 세 개는 후속 구현용 초안입니다. 세션 쿠키 이름 session과 개발 단계 동시 로그인 허용을 기준으로 합니다.
servers:
- url: http://localhost:8000
  description: 개발 서버 주소 예시
tags:
- name: Auth
  description: 로그인과 세션 관리. 구현 예정
- name: Clients
  description: R03 대상자 목록·상세·통합 이력
security:
- CookieAuth: []
paths:
  /auth/login:
    post:
      tags:
      - Auth
      operationId: login
      summary: 로그인
      description: 계정과 비밀번호를 확인한 뒤 새 세션을 발급합니다. 새 로그인은 기존의 다른 유효 세션을 유지합니다. 성공 응답의 Set-Cookie로 세션을 전달합니다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              login_id: demo_worker
              password: example-password
      responses:
        '200':
          description: 로그인 성공과 현재 사용자 정보
          headers:
            Set-Cookie:
              description: 실제 세션 토큰을 HttpOnly 쿠키로 설정합니다. HTTPS 배포 환경에서는 Secure 속성을 적용합니다. 쿠키 만료는 서버의 세션 만료 정책에 맞춥니다.
              schema:
                type: string
                example: session=example-session-token; Path=/; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/LoginFailed'
        '422':
          $ref: '#/components/responses/InvalidRequest'
  /auth/me:
    get:
      tags:
      - Auth
      operationId: getCurrentUser
      summary: 내 정보와 로그인 상태 조회
      description: 유효한 세션에 해당하는 사용자·역할·소속·허용 지역을 조회합니다. 세션이 없거나 만료·폐기됐거나 계정이 비활성 상태이면 401을 반환합니다. 반환한 역할 정보와 별개로
        각 업무 API에서 기관·지역·배정 권한을 검사합니다.
      responses:
        '200':
          description: 현재 로그인 사용자
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
  /auth/logout:
    post:
      tags:
      - Auth
      operationId: logout
      summary: 현재 세션 로그아웃
      description: 현재 요청에 사용한 세션만 폐기하고 쿠키를 삭제합니다. 같은 계정의 다른 유효 세션은 유지합니다.
      responses:
        '204':
          description: 현재 세션 종료. 응답 본문은 없습니다.
          headers:
            Set-Cookie:
              description: 로그인 쿠키와 같은 이름·경로로 만료시켜 삭제합니다.
              schema:
                type: string
                example: session=; Path=/; Max-Age=0; HttpOnly; SameSite=Lax
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
  /clients:
    get:
      summary: 대상자 목록·검색·필터 조회
      operationId: listClients
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: 1부터 시작하는 페이지 번호
          default: 1
          title: Page
        description: 1부터 시작하는 페이지 번호
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: 페이지당 항목 수
          default: 20
          title: Page Size
        description: 페이지당 항목 수
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 이름 또는 가상 번호의 부분 검색. 빈 문자열이면 전체 조회
          title: Search
        description: 이름 또는 가상 번호의 부분 검색. 빈 문자열이면 전체 조회
      - name: region_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: 행정동 ID
          title: Region Id
        description: 행정동 ID
      - name: risk_grade
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          description: 위험모델의 등급 코드. 등급 경계는 모델 정책을 따름
          title: Risk Grade
        description: 위험모델의 등급 코드. 등급 경계는 모델 정책을 따름
      - name: needs_benefit_review
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: NEEDS_REVIEW 혜택 존재 여부. 생략하면 양쪽 모두 조회
          title: Needs Benefit Review
        description: NEEDS_REVIEW 혜택 존재 여부. 생략하면 양쪽 모두 조회
      - name: unchecked_days
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
          description: 마지막 성공 확인이 조회 시각에서 N일 이전이거나 성공 이력이 없는 대상자
          title: Unchecked Days
        description: 마지막 성공 확인이 조회 시각에서 N일 이전이거나 성공 이력이 없는 대상자
      - name: sort_by
        in: query
        required: false
        schema:
          enum:
          - priority
          - last_success_at
          - next_check_date
          type: string
          description: priority는 현재 표시하는 위험점수 기준
          default: priority
          title: Sort By
        description: priority는 현재 표시하는 위험점수 기준
      - name: sort_order
        in: query
        required: false
        schema:
          enum:
          - asc
          - desc
          type: string
          default: desc
          title: Sort Order
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientListResponse'
              example:
                data:
                  items:
                  - id: 00000000-0000-4000-8000-000000000001
                    client_number: DEMO-001
                    name: 가상 어르신 01
                    age: 75
                    region:
                      id: 00000000-0000-4000-8000-000000000004
                      name: 의창동
                      district_name: 의창구
                    workers:
                    - id: 00000000-0000-4000-8000-000000000002
                      name: 가상 담당자
                    household_type: SINGLE
                    risk:
                      score: null
                      grade: null
                      calculation_status: PENDING
                      completeness: null
                      stale: false
                      calculated_at: null
                      summary: []
                    last_success_at: '2026-11-03T09:00:00+09:00'
                    last_attempt_at: '2026-11-03T09:00:00+09:00'
                    next_check_date: '2026-11-09'
                    needs_benefit_review: false
                    field_info:
                      age:
                        status: AVAILABLE
                        reason: null
                        source_label: 가상 초기 상담 기록
                        source_url: null
                        checked_at: '2026-11-03T09:00:00+09:00'
                      household_type:
                        status: AVAILABLE
                        reason: null
                        source_label: 가상 초기 상담 기록
                        source_url: null
                        checked_at: '2026-11-03T09:00:00+09:00'
                      risk.score:
                        status: UNAVAILABLE
                        reason: 위험점수 계산 결과가 없습니다.
                        source_label: null
                        source_url: null
                        checked_at: null
                      risk.grade:
                        status: UNAVAILABLE
                        reason: 위험점수 계산 결과가 없습니다.
                        source_label: null
                        source_url: null
                        checked_at: null
                      last_success_at:
                        status: AVAILABLE
                        reason: null
                        source_label: 가상 초기 상담 기록
                        source_url: null
                        checked_at: '2026-11-03T09:00:00+09:00'
                      last_attempt_at:
                        status: AVAILABLE
                        reason: null
                        source_label: 가상 초기 상담 기록
                        source_url: null
                        checked_at: '2026-11-03T09:00:00+09:00'
                      next_check_date:
                        status: AVAILABLE
                        reason: null
                        source_label: 가상 초기 상담 기록
                        source_url: null
                        checked_at: '2026-11-03T09:00:00+09:00'
                  page: 1
                  page_size: 20
                  total: 1
                  queried_at: '2026-11-15T10:00:00+09:00'
                  data_mode: DEMO
                error: null
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      tags:
      - Clients
      description: CLI01~CLI03. 현재 사용자 정보는 인증 계층에서 받습니다. 기관·기관과 사용자의 허용 지역 교집합·현재 배정을 먼저 적용합니다. 관리자도 개인 열람에 같은 범위
        검사를 받습니다. 배정은 starts_at이 조회 시각 이하이고 ends_at이 없거나 조회 시각이 ends_at보다 이르면 유효합니다. 필터는 AND로 결합합니다. search는 공백을
        제거한 검색어의 이름 또는 가상 번호 부분 일치이며 빈 문자열은 전체 조회입니다. needs_benefit_review는 support_status=NEEDS_REVIEW인 연결 혜택이
        하나 이상 있을 때 true이며 연결 혜택이 없으면 false입니다. unchecked_days는 마지막 성공 확인시각이 queried_at에서 N일을 뺀 시각 이하이거나 성공 이력이 없는
        경우를 포함합니다. priority는 응답에 표시한 위험점수로 정렬합니다. 모든 정렬에서 null은 마지막이며 동률은 대상자 ID 오름차순입니다. total은 권한과 필터를 적용한 인원수이며
        빈 결과나 마지막 페이지 이후의 요청도 200과 빈 items를 반환합니다. 목록·total·파생값은 한 요청의 같은 읽기 스냅샷을 사용하고 queried_at은 해당 조회의 기준시각입니다.
        페이지 요청마다 최신 자료를 조회합니다. 응답 일시는 ISO 8601 한국시간(+09:00), 날짜는 YYYY-MM-DD입니다. 연락 기록이 있으면 occurred_at·created_at·id
        내림차순의 첫 기록에서 next_check_date를 가져오며 기록이 없으면 null입니다. last_success_at은 SUCCESS만, last_attempt_at은 모든 결과의 가장
        최근 연락시각입니다. 위험 계산 결과가 없으면 점수·등급·완성여부·계산시각은 null, summary는 빈 배열로 반환합니다. 이전 계산 결과를 표시할 때 최신 입력·모델·실행과의 차이는
        stale로 알리고 현재 calculation_status를 함께 제공합니다. field_info는 나이·가구형태·위험점수/등급·성공/시도시각·다음 확인일의 상태·출처·확인일을 필드 경로별로
        제공합니다.
  /clients/{client_id}:
    get:
      summary: 대상자 상세 조회
      operationId: getClient
      parameters:
      - name: client_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Client Id
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientDetailResponse'
              example:
                data:
                  id: 00000000-0000-4000-8000-000000000001
                  client_number: DEMO-001
                  name: 가상 어르신 01
                  age: 75
                  region:
                    id: 00000000-0000-4000-8000-000000000004
                    name: 의창동
                    district_name: 의창구
                  workers:
                  - id: 00000000-0000-4000-8000-000000000002
                    name: 가상 담당자
                  household_type: SINGLE
                  risk:
                    score: null
                    grade: null
                    calculation_status: PENDING
                    completeness: null
                    stale: false
                    calculated_at: null
                    summary: []
                  last_success_at: '2026-11-03T09:00:00+09:00'
                  last_attempt_at: '2026-11-03T09:00:00+09:00'
