      description: CLI04. 목록과 동일한 기관·지역·현재 배정 범위를 검사하며 권한 밖 대상자와 존재하지 않는 대상자는 모두 404입니다. 기본정보·기본 마스킹 연락처·위치·최신 건강/소득
        프로필·혜택 지원 상태와 실제 수급 상태를 조회합니다. 휴대전화는 010-****-1234처럼 가운데 부분을 가리며 유선전화도 가운데 부분을 가립니다. 형식을 구분할 수 없으면 전체를 가립니다.
        프로필은 최신 revision 전체를 사용하고 과거 revision으로 빈 값을 보충하지 않습니다. 프로필 자체가 없으면 profile은 null입니다. 확인한 건강·취약 항목이 없으면
        빈 배열이고 미확인/누락은 null입니다. benefits는 연결된 제도의 지원·수급 상태이며 연결된 제도가 없으면 빈 배열입니다. UNKNOWN 수급은 미확인 상태입니다. 목록의 공통
        규칙에 더해 field_info에는 생년월일·주소·마스킹 연락처·좌표·각 프로필 값의 상태와 출처·확인일을 제공합니다. 필드 키는 birth_date, location, profile.health_flags처럼
        데이터 내부 경로를 사용합니다. AVAILABLE은 확인한 값이며 DB의 KNOWN 상태에 대응합니다. MISSING은 누락, UNCONFIRMED는 미확인, UNAVAILABLE은 계산/원천자료
        이용 불가, RESTRICTED는 필드 열람 제한, NOT_APPLICABLE은 해당 없음입니다. 누락·미확인·이용 불가·열람 제한·해당 없음은 값을 null로 반환하고 reason에 이유를
        제공합니다. 날짜·일시·가상 자료 표시와 점수 규칙은 목록과 같습니다.
